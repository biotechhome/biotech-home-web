<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>পাসওয়ার্ড পরিবর্তন — Biotech Home</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css"><script>try{var t=localStorage.getItem("bh-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script><style>.fold>summary{cursor:pointer;list-style:none}.fold>summary::-webkit-details-marker{display:none}.fold>summary h2{margin:0;display:inline}.fold>summary::before{content:"▸ ";font-size:20px}.fold[open]>summary::before{content:"▾ "}</style></head><body>
<header class="top"><div class="wrap"><a class="brand" href="index.html"><img src="assets/logo-clear.png" alt="Biotech Home"></a>
<nav class="nav"><a class="hide-m" href="index.html#courses">কোর্স</a><a class="hide-m" href="index.html#library">লাইব্রেরি</a><a class="hide-m" href="index.html#merit">মেধাতালিকা</a><a class="hide-m" href="letters.html">খোলা চিঠি</a><button class="theme" id="theme" aria-label="থিম পরিবর্তন">🌙</button><span id="navauth"><a class="btn sm" href="login.html">লগইন</a></span></nav></div></header>

<main class="wrap" style="padding:20px 20px 40px;max-width:560px"><div class="pagehead"><h1>পাসওয়ার্ড পরিবর্তন</h1><p class="sub"><a href="admin.html">← অ্যাডমিন প্যানেল</a></p></div>
<div class="card"><form id="f" autocomplete="off"><label>বর্তমান পাসওয়ার্ড</label><input id="o" type="password" autocomplete="current-password">
<label>নতুন পাসওয়ার্ড (কমপক্ষে ১০ অক্ষর)</label><input id="n" type="password" autocomplete="new-password" minlength="10">
<label>নতুন পাসওয়ার্ড আবার লিখুন</label><input id="c" type="password" autocomplete="new-password">
<div class="hint">অক্ষর, সংখ্যা ও চিহ্ন মিলিয়ে লম্বা পাসওয়ার্ড দিন। এটি কাউকে বা কোনো চ্যাটে দেবেন না।</div>
<button class="btn" style="margin-top:12px" id="go" type="submit">পাসওয়ার্ড বদলান</button><div id="m" class="msg"></div></form></div></main>
<script src="js/vendor/supabase.js"></script><script src="js/app.js"></script><script>
$('#f').onsubmit=async e=>{e.preventDefault();const o=$('#o').value,n=$('#n').value,c=$('#c').value,m=$('#m');
 if(!o){say(m,'বর্তমান পাসওয়ার্ড লিখুন।',false);return}
 if(n.length<10){say(m,'নতুন পাসওয়ার্ড কমপক্ষে ১০ অক্ষরের হতে হবে।',false);return}
 if(n!==c){say(m,'দুটি নতুন পাসওয়ার্ড মেলেনি।',false);return}
 if(n===o){say(m,'নতুন পাসওয়ার্ড আগেরটার মতো হতে পারবে না।',false);return}
 $('#go').disabled=true;
 try{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html';return}
  const re=await sb.auth.signInWithPassword({email:session.user.email,password:o});
  if(re.error){say(m,'বর্তমান পাসওয়ার্ড ঠিক নয়।',false);return}
  const up=await sb.auth.updateUser({password:n});
  if(up.error){say(m,'পাসওয়ার্ড বদলানো যায়নি। অন্য একটি পাসওয়ার্ড দিয়ে চেষ্টা করুন।',false);return}
  $('#f').reset();say(m,'✔ পাসওয়ার্ড বদলে গেছে।',true)
 }catch(_){say(m,'নেটওয়ার্ক সমস্যা। আবার চেষ্টা করুন।',false)}finally{$('#go').disabled=false}};
(async()=>{const me=await requireLogin();if(!me)return;if(me.role!=='admin'||me.status!=='active'){location.href='dashboard.html'}})();
</script></body></html>
